<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Тень -->
  <rect x="20" y="26" width="480" height="480" rx="108" ry="108"
        fill="#0a1628" opacity="0.30"/>

  <!-- Основной фон -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108"
        fill="url(#bg)"/>

  <!-- Блик сверху -->
  <rect x="16" y="16" width="480" height="240" rx="108" ry="108"
        fill="url(#shine)"/>

  <!-- Угловые скобки (зона скриншота) -->
  <g stroke="white" stroke-width="13" fill="none"
     stroke-linecap="round" stroke-linejoin="round" opacity="0.50">
    <path d="M 128 186 L 128 128 L 186 128"/>
    <path d="M 326 128 L 384 128 L 384 186"/>
    <path d="M 128 326 L 128 384 L 186 384"/>
    <path d="M 326 384 L 384 384 L 384 326"/>
  </g>

  <!-- ===== Монограмма CX ===== -->
  <g stroke="white" fill="none" stroke-linecap="round">

    <!-- Буква C (дуга, открытая вправо) -->
    <path d="M 268 194 A 80 80 0 1 0 268 318"
          stroke-width="26"/>

    <!-- Буква X (перекрестие, чуть правее) -->
    <line x1="264" y1="208" x2="356" y2="304"
          stroke-width="26"/>
    <line x1="356" y1="208" x2="264" y2="304"
          stroke-width="26"/>
  </g>
</svg>
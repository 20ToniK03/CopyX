[package]
name = "copyx"
version = "0.1.4"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "CopyX — lightweight ShareX alternative with Liquid Glass UI"

[[bin]]
name = "CopyX"
path = "src/main.rs"

[workspace]
members = ["crates/core"]

[dependencies]
copyx-core = { path = "crates/core" }
image = { version = "0.25", default-features = false, features = ["png"] }
dirs-next = "2.0"

[dependencies.windows]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true